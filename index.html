<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Kelontong - fatur62</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-emerald-500 selection:text-white">

  <!-- Header App dengan Branding -->
  <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 p-4 sticky top-0 z-50 flex justify-between items-center shadow-2xl">
    <div>
      <h1 class="text-lg font-bold tracking-wide text-emerald-400 flex items-center gap-2" id="namaTokoDisplay">
        Toko Kelontong
      </h1>
      <p class="text-[10px] text-slate-400 font-medium">Sistem Kasir & Zakat Perniagaan</p>
    </div>
    
    <!-- Indicator & Dev Tag -->
    <div class="flex items-center gap-2 bg-slate-800/90 px-3 py-1.5 rounded-full border border-slate-700/60 shadow-inner">
      <span class="relative flex h-2 w-2">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
      </span>
      <span class="text-[10px] text-slate-300 font-medium">developer : <strong class="text-emerald-300">fatur62</strong></span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 p-4 max-w-lg w-full mx-auto space-y-4">
    
    <!-- Banner Status Offline -->
    <div class="bg-gradient-to-r from-emerald-950/40 to-slate-900 border border-emerald-500/20 rounded-2xl p-4 shadow-lg flex items-center justify-between">
      <div>
        <p class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Sistem Offline Ready</p>
        <p class="text-[11px] text-slate-400">Data tersimpan aman di penyimpanan lokal HP.</p>
      </div>
      <span class="text-xl">⚡</span>
    </div>

    <!-- Ringkasan Cepat -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-slate-900/90 border border-slate-800 p-3.5 rounded-2xl">
        <p class="text-[11px] text-slate-400">Penjualan Hari Ini</p>
        <p class="text-base font-bold text-slate-100 mt-1">Rp 0</p>
      </div>
      <div class="bg-slate-900/90 border border-slate-800 p-3.5 rounded-2xl">
        <p class="text-[11px] text-slate-400">Estimasi Zakat</p>
        <p class="text-base font-bold text-amber-400 mt-1">Rp 0</p>
      </div>
    </div>

    <!-- Quick Action Navigation -->
    <div class="grid grid-cols-2 gap-3 pt-2">
      <button class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-emerald-900/30 active:scale-95 transition text-sm">
        + Transaksi Baru
      </button>
      <button class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-3 px-4 rounded-xl border border-slate-700 active:scale-95 transition text-sm">
        📦 Kelola Barang
      </button>
    </div>

  </main>

  <footer class="p-4 text-center text-[10px] text-slate-500 border-t border-slate-900">
    Aplikasi Manajemen Kelontong • Open Source Project
  </footer>

</body>
</html>
