<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Kelontong - fatur62</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Header App -->
  <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 p-4 sticky top-0 z-50 flex justify-between items-center">
    <div onclick="gantiNamaToko()" class="cursor-pointer">
      <h1 class="text-lg font-bold tracking-wide text-emerald-400" id="namaTokoDisplay">Toko Kelontong</h1>
      <p class="text-[10px] text-slate-400">Ketuk untuk ubah nama toko</p>
    </div>
    
    <div class="flex items-center gap-2 bg-slate-800/90 px-3 py-1.5 rounded-full border border-slate-700">
      <span class="relative flex h-2 w-2">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
      </span>
      <span class="text-[10px] text-slate-300 font-medium">developer : <strong class="text-emerald-300">fatur62</strong></span>
    </div>
  </header>

  <main class="p-4 max-w-lg mx-auto space-y-4">
    <div class="bg-slate-900 border border-emerald-500/20 rounded-xl p-4 text-center">
      <p class="text-[11px] text-slate-400">Selamat datang kembali!</p>
    </div>
  </main>

  <script>
    // Fungsi Menampilkan Nama Toko
    function muatNamaToko() {
      const nama = localStorage.getItem('namaToko') || 'Toko Anda';
      document.getElementById('namaTokoDisplay').innerText = nama;
    }

    // Fungsi Ganti Nama Toko
    function gantiNamaToko() {
      const namaBaru = prompt("Masukkan Nama Toko Anda:", localStorage.getItem('namaToko') || "");
      if (namaBaru) {
        localStorage.setItem('namaToko', namaBaru);
        muatNamaToko();
      }
    }

    // Jalankan saat pertama kali buka
    muatNamaToko();
  </script>
</body>
</html>
